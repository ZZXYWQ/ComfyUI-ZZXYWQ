name: Video utilities regression tests
on:
  push:
    paths:
      - 'nodes/**'
      - 'tests/test_video.py'
      - '.github/workflows/video-tests.yml'
  pull_request:
    paths:
      - 'nodes/**'
      - 'tests/test_video.py'
      - '.github/workflows/video-tests.yml'
jobs:
  video-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s tests -p test_video.py -v
